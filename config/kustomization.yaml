apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ci-namespace.yaml
- argo-project.yaml
- pacman-konflux-argo.yaml
- tkn-pac-repository.yaml
- image-streams/git-init-rhel9.yaml

patches:
  - target:
      kind: ImageStream
      name: git-init-rhel9
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: pacman-konflux-ci

